name: Python and native Claude hook checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/sync_policy.py --check
      - run: python -m unittest discover -s skills/codex-worker/scripts -p "test_*.py"
      - run: python -m unittest discover -s tests -p "test_*.py"
  native-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Deliberately pinned. Update with a verified native-host test run.
      CLAUDE_TESTED_VERSION: '2.1.317'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_policy.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@${CLAUDE_TESTED_VERSION}
      - run: claude --version
      # This uses the CLI's real mod test runtime; no login or model call.
      # Missing CLI/runtime and failing tests must fail this job.
      - run: claude plugin test .
